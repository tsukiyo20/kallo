[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
# GPL-3.0-or-later, with the App Store additional permission in
# APPSTORE-EXCEPTION.md. The measurement data (kallo-data) stays CC BY-SA 4.0.
license = "GPL-3.0-or-later"
authors = ["Kallo contributors"]
repository = "https://github.com/tsukiyo20/kallo"
homepage = "https://github.com/tsukiyo20/kallo"
readme = "README.md"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = [
    "png",
    "tiff",
    "jpeg",
] }
clap = { version = "4", features = ["derive"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
