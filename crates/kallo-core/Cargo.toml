[package]
name = "kallo-core"
description = "Reference film model: characteristic curves and development kinetics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["film", "simulation", "photography", "colour", "development"]
categories = ["graphics", "simulation"]

[features]
default = ["parallel"]
# Render the pixels on every core. On by default because the render is
# embarrassingly parallel; turn it off for a target without threads.
parallel = ["dep:rayon"]

[dependencies]
kallo-spectral = { path = "../kallo-spectral", version = "0.1.0" }
rayon = { version = "1", optional = true }

# The measurements, carried as files rather than compiled into this crate: the
# build reads them and writes the stock tables from them. It is not a runtime
# dependency — nothing here links against it, and none of its bytes are in the
# binary.
[build-dependencies]
kallo-data = { path = "../kallo-data", version = "0.1.0" }

[lints]
workspace = true
