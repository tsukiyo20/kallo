# cargo-deny policy.
#
# The project ships binaries and its own code is GPL-3.0-or-later, but the
# dependency graph stays permissive: our licence is the only copyleft in it, and
# a dependency that changed that is a decision for this file, not a surprise. No
# unknown registries, no git sources.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is reached only through wgpu's type machinery, and it is a
    # proc-macro that expands at compile time: there is no runtime code to be
    # vulnerable, and no maintained alternative that wgpu 26 accepts. It is
    # unmaintained, not broken. Dropping it means raising the workspace MSRV to
    # 1.87 for wgpu 30, which is a decision with its own cost and is not worth
    # taking for a macro.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro in wgpu 26; no runtime code" },
]

[licenses]
# The licences a *dependency* may carry. Kallo's own licence is
# GPL-3.0-or-later (see LICENSE); nothing in this list licenses Kallo.
# Permissive only. If a dependency needs an addition, add it here with a
# comment explaining why, in the same commit that adds the dependency.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Allowed-but-unused licences are fine: the list is a policy for future
# dependencies, not an inventory of today's.
unused-allowed-license = "allow"

# The project itself is copyleft: every workspace crate but the data crate is
# GPL-3.0-or-later (the App Store permission in APPSTORE-EXCEPTION.md is an
# additional permission, not a different licence). They are named one by one so
# that the allow list above still means "what a dependency may be", and adding a
# copyleft dependency stays a deliberate edit here.
[[licenses.exceptions]]
name = "kallo-api"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-cli"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-core"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-gpu"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-io"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-raw"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-spectral"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
name = "kallo-view"
allow = ["GPL-3.0-or-later"]

# The other copyleft entry in the graph, and it is ours too: `kallo-core`'s
# build script reads the measured files from `kallo-data`, which is data under
# CC BY-SA 4.0 on purpose. No program text in the graph may be copyleft unless
# it is ours.
[[licenses.exceptions]]
name = "kallo-data"
allow = ["CC-BY-SA-4.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Not used today. Listed so that a future dependency cannot quietly pull
    # OpenSSL in next to the system TLS stack.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
