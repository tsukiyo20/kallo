# The app's binding crate is built by Flutter's native-assets hook, not by
# `cargo build` at the root: its target is the app, not a published crate.
[workspace]

[package]
name = "rust_lib_kallo"
description = "The model as a library the app can call"
version = "0.3.2"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
kallo-api = { path = "../../crates/kallo-api" }
# The scalars a stock recipe moves. The app hands them over as one number per
# control, in the order of `Tuning::KEYS`; the type itself is the model's, so the
# app does not carry a second vocabulary for it.
kallo-core = { path = "../../crates/kallo-core" }
kallo-io = { path = "../../crates/kallo-io" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# The settings page names the processor as well as the card; sysinfo is the
# cross-platform answer to a question no standard library exposes, and it is
# allowed to be missing (Android may withhold /proc).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

# The large-buffer allocator is macOS-only. libc is the wrapper's, and the app
# links it through the model's dependencies on every platform anyway.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
