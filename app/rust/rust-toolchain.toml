[toolchain]
# native_toolchain_rust pins an exact channel for reproducible build hooks.
channel = "1.99.0"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "i686-linux-android",
  # The desktop the last four targets were missing: native_toolchain_rust
  # refuses to build for a target that is not in this list, so a Windows
  # checkout could not link the model at all.
  "x86_64-pc-windows-msvc",
]
