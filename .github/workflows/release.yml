name: release

on:
  push:
    tags: ["v*"]
  # A dry run: build every platform and upload the packages as workflow
  # artifacts, without publishing a release. A tag does both.
  workflow_dispatch:
    inputs:
      skip_cli:
        description: Skip the CLI builds
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    if: github.event_name == 'push' || !inputs.skip_cli
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p kallo-cli

      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="kallo-${GITHUB_REF_NAME}-${TARGET}"
          bin="kalo"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="kalo.exe"
          fi
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/${bin}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: kallo-cli-${{ matrix.target }}
          path: dist/*.tar.gz

  # A tag publishes every platform: the CLI built above, the desktop apps (a
  # portable archive and an installer: DMG, MSIX, .deb), an unsigned iOS IPA
  # and an Android APK. The portable desktop file names are the updater's
  # contract: app/lib/lab/updates.dart looks for exactly these four names on
  # the release, so renaming one here breaks self-update unless the updater
  # changes with it. The installers, the Linux tar, the iOS IPA and the Android
  # APK are for people, not for the updater.
  desktop:
    name: desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Flutter builds one app for both Mac architectures, so the hook builds
      # the model twice — and the runner's own target is not enough for the
      # other slice.
      - name: rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          bundle="app/build/macos/Build/Products/Release/Kallo.app"
          # Which slices the build actually carries decides the file name: the
          # updater picks by the Mac's own architecture.
          archs="$(lipo -archs "$bundle/Contents/MacOS/Kallo")"
          arm=false
          intel=false
          case " ${archs} " in *" arm64 "*) arm=true ;; esac
          case " ${archs} " in *" x86_64 "*) intel=true ;; esac
          if ${arm} && ${intel}; then
            name="kallo-desktop-macos-universal.zip"
          elif ${arm}; then
            name="kallo-desktop-macos-aarch64.zip"
          elif ${intel}; then
            name="kallo-desktop-macos-x86_64.zip"
          else
            echo "unexpected architectures: ${archs}" >&2
            exit 1
          fi
          mkdir -p app/dist
          ditto -c -k --keepParent "$bundle" "app/dist/${name}"

          # The DMG is the installer a Mac person expects; the zip above is
          # what the updater and a portable install read.
          staging="$(mktemp -d)/Kallo"
          mkdir -p "$staging"
          cp -R "$bundle" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Kallo" -srcfolder "$staging" -ov -format UDZO \
            "app/dist/${name%.zip}.dmg"
          rm -rf "$(dirname "$staging")"

      - uses: actions/upload-artifact@v4
        with:
          name: kallo-desktop-macos
          path: app/dist/*

  desktop-windows:
    name: desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: package
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          if (-Not (Test-Path "$release/kallo.exe")) {
            throw "the build has no kallo.exe"
          }
          New-Item -ItemType Directory -Force app/dist | Out-Null
          Compress-Archive -Path "$release/*" `
            -DestinationPath "app/dist/kallo-desktop-windows-x86_64.zip" -Force

      # The MSIX is signed with the repository's self-signed certificate; its
      # public half ships as kallo-msix.cer so a person can trust the package
      # once. The PFX and its password are repository secrets (`gh secret set
      # MSIX_CERT_PFX` / `MSIX_CERT_PASSWORD`); without them no release builds.
      - name: msix certificate
        shell: bash
        env:
          MSIX_CERT_PFX_SECRET: ${{ secrets.MSIX_CERT_PFX }}
        run: |
          set -euo pipefail
          if [ -z "${MSIX_CERT_PFX_SECRET}" ]; then
            echo "MSIX_CERT_PFX is not configured" >&2
            exit 1
          fi
          echo "${MSIX_CERT_PFX_SECRET}" | base64 --decode > "$RUNNER_TEMP/kallo-msix.pfx"

      - name: build msix
        working-directory: app
        shell: pwsh
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$').Matches[0].Groups[1].Value
          $version = $version.Split('+')[0]
          dart run msix:create --build-windows false `
            --certificate-path "$env:RUNNER_TEMP\kallo-msix.pfx" `
            --certificate-password "$env:MSIX_CERT_PASSWORD" `
            --publisher "CN=Kallo" `
            --logo-path "$env:GITHUB_WORKSPACE\app\icon\kallo-icon-1024.png" `
            --output-path "$env:GITHUB_WORKSPACE\app\dist" `
            --output-name "kallo-desktop-windows-x86_64" `
            --version "$version.0" `
            --install-certificate false

      - uses: actions/upload-artifact@v4
        with:
          name: kallo-desktop-windows
          path: app/dist/*

  # The Linux bundle is a tar a person unpacks and runs; it carries the same
  # runner/Release layout Flutter builds, with the folder renamed to `kallo`.
  desktop-linux:
    name: desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Flutter's Linux toolchain: the GTK headers and the build tools the
      # CMake project asks for.
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release

      - name: package
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf dist/kallo dist/kallo-desktop-linux-x86_64.tar.gz
          mkdir -p dist
          cp -R build/linux/x64/release/bundle dist/kallo
          tar -czf dist/kallo-desktop-linux-x86_64.tar.gz -C dist kallo
          rm -rf dist/kallo
          ls -lh dist/kallo-desktop-linux-x86_64.tar.gz

          # A .deb is the installable form; the tar above stays for a portable
          # copy. The package keeps everything under /opt/kallo and links a
          # launcher into /usr/bin.
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)"
          root="dist/deb-root"
          rm -rf "$root"
          mkdir -p "$root/DEBIAN" "$root/opt/kallo" "$root/usr/bin" \
            "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/1024x1024/apps"
          cp -R build/linux/x64/release/bundle/. "$root/opt/kallo/"
          ln -s /opt/kallo/kallo "$root/usr/bin/kallo"
          cp icon/kallo-icon-1024.png \
            "$root/usr/share/icons/hicolor/1024x1024/apps/kallo.png"
          cat > "$root/DEBIAN/control" <<EOF
          Package: kallo
          Version: ${version}
          Architecture: amd64
          Maintainer: Kallo contributors <kallo@users.noreply.github.com>
          Section: graphics
          Priority: optional
          Depends: libgtk-3-0, liblzma5
          Description: Kallo, a film simulation darkroom
          EOF
          cat > "$root/usr/share/applications/kallo.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Kallo
          Comment=A film simulation darkroom
          Exec=/opt/kallo/kallo
          Icon=kallo
          Terminal=false
          Categories=Graphics;Photography;
          EOF
          dpkg-deb --build --root-owner-group "$root" \
            dist/kallo-desktop-linux-x86_64.deb
          rm -rf "$root"
          ls -lh dist/kallo-desktop-linux-x86_64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: kallo-desktop-linux
          path: app/dist/*

  # There is no Apple signing identity in this repository, so the iOS app is
  # built with codesigning off and shipped as an unsigned IPA: a sideloading
  # tool (Sideloadly, AltStore) signs it with the installer's own identity.
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: build
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: package
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf dist/Payload
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry kallo-ios-unsigned.ipa Payload)
          rm -rf dist/Payload
          ls -lh dist/kallo-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: kallo-ios
          path: app/dist/*.ipa

  # There is no Play signing identity in this repository either: the APK is
  # signed with the debug key, which is what a sideloaded build needs.
  android:
    name: Android (universal APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      # Flutter 3.47 pins the NDK it builds against (28.2). The runner's SDK
      # may carry a different revision, and the native-assets hook needs this
      # one's clang, so install it here instead of letting Gradle discover it.
      - name: android ndk
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      - name: build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: package
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/kallo-android-universal.apk
          ls -lh dist/kallo-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kallo-android
          path: app/dist/*.apk

  # One release, written once, after every build has succeeded: a failed
  # platform leaves no half-published release behind.
  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [build, desktop, desktop-windows, desktop-linux, ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The public half of the MSIX signing certificate, so a Windows user can
      # trust the package once and keep updating through later releases.
      - name: msix certificate
        run: cp app/windows/msix/kallo-msix.cer dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
